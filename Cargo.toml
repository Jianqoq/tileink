[package]
name = "tileink"
version = "0.1.0"
edition = "2024"

[dependencies]
peniko = "0.6.1"
bytemuck = "1.25.0"
wgpu = "30.0.0"
pollster = "0.4"
usvg = "0.47.0"
wide = "1.5.0"
rayon = "1.12.0"
rustc-hash = "2.1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "webp"] }
cosmic-text = "0.19.0"
fontdb = { version = "0.23", default-features = false }
swash = "0.2.6"
vello = { version = "0.9.0", optional = true }
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
windows-numerics = { version = "0.3.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[features]
directwrite-reference = ["dep:windows", "dep:windows-numerics"]
vello-compare = ["dep:vello"]
wgpu = []

[dev-dependencies]
winit = "0.30"
criterion = "0.8.2"

[[bench]]
name = "retained_scale"
harness = false

[[bench]]
name = "retained_dirty_ratio"
harness = false

[[example]]
name = "wgpu_examples"
path = "examples/wgpu/all.rs"

[[example]]
name = "svg_fixture_render"
path = "examples/svg_fixture_render.rs"

[[example]]
name = "svg_tiger_bench"
path = "examples/svg_tiger_bench.rs"

[[example]]
name = "image_key_bench"
path = "examples/image_key_bench.rs"

[[example]]
name = "dirty_tiles_bench"
path = "examples/dirty_tiles_bench.rs"

[[example]]
name = "retained_scale_bench"
path = "examples/retained_scale_bench.rs"

[[example]]
name = "retained_dirty_ratio_bench"
path = "examples/retained_dirty_ratio_bench.rs"

[[example]]
name = "blur_pairing_bench"
path = "examples/blur_pairing_bench.rs"

[[example]]
name = "svg_tiger_vello_compare"
path = "examples/svg_tiger_vello_compare.rs"
required-features = ["vello-compare"]

[[example]]
name = "winit_svg_tiger"
path = "examples/winit_svg_tiger.rs"

[[example]]
name = "vello_compare"
path = "examples/vello_compare.rs"
required-features = ["vello-compare"]

[[example]]
name = "wgpu_batch"
path = "examples/wgpu_batch.rs"


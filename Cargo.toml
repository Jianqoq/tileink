[workspace]
resolver = "3"
members = ["vendor/wgpu-hal"]

[package]
name = "tileink"
version = "0.1.2"
edition = "2024"
description = "Tile-based GPU-compute 2D renderer with immediate and transactional retained scene APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jianqoq/tileink"
readme = "README.md"
keywords = ["graphics", "renderer", "vector-graphics", "wgpu"]
categories = ["graphics", "rendering"]
# The registry artifact is a buildable library, not a mirror of repository-only examples,
# benchmarks, website files, test fixtures, generated renders, or fonts.
include = [
    "/src/**/*.rs",
    "!/src/**/tests.rs",
    "!/src/**/tests/**",
    "/src/wgpu/shaders/**/*.wgsl",
    "/src/shaders/**/*.hlsl",
    "/src/shaders/**/*.hlsli",
    "/src/shaders/**/*.metal",
    "/src/shaders/**/*.json",
    "/build.rs",
    "/build/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/WGPU_PATCHES.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }
peniko = "0.6.1"
bytemuck = "1.25.2"
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
usvg = "0.48.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
png = "0.18.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "webp"] }
cosmic-text = "0.19.0"
swash = "0.2.10"
vello = { version = "0.10.0", optional = true }
windows-numerics = { version = "0.3.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = { version = "0.38", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[build-dependencies]
serde_json = "1"
naga = { version = "30.0.1", optional = true, features = ["hlsl-out", "wgsl-in"] }
sha2 = "0.11.0"

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:naga", "dep:windows"]
native-dx12 = ["dep:serde_json", "dep:sha2", "dep:windows", "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common", "windows/Win32_System_Threading", "windows/Win32_Security"]
native-vulkan = ["dep:serde_json", "dep:sha2", "dep:ash"]
native = ["native-dx12", "native-vulkan"]
bench-internals = []
directwrite-reference = [
    "wgpu",
    "windows/Win32_Foundation",
    "windows/Win32_Graphics_Direct2D",
    "windows/Win32_Graphics_Direct2D_Common",
    "windows/Win32_Graphics_DirectWrite",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Imaging",
    "windows/Win32_System_Com",
    "dep:windows-numerics",
]
vello-compare = ["wgpu", "dep:vello"]

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }
ash = "0.38"
serde_json = "1"
winit = "0.30"
criterion = "0.8.2"
sha2 = "0.11.0"


[workspace]
resolver = "3"
members = []

[package]
name = "tileink"
version = "0.1.2"
edition = "2024"
description = "Tile-based GPU-compute 2D renderer with immediate and transactional retained scene APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jianqoq/tileink"
readme = "README.md"
keywords = ["graphics", "renderer", "vector-graphics"]
categories = ["graphics", "rendering"]
# The registry artifact is a buildable library, not a mirror of repository-only examples,
# website files, test fixtures, generated renders, or fonts.
include = [
    "/src/**/*.rs",
    "!/src/**/tests.rs",
    "!/src/**/tests/**",
    "/src/shaders/**/*.hlsl",
    "/src/shaders/**/*.hlsli",
    "/src/shaders/**/*.metal",
    "/src/shaders/**/*.json",
    "/build.rs",
    "/build/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/clippy.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }
peniko = "0.6.1"
bytemuck = "1.25.2"
usvg = "0.48.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
png = "0.18.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "webp"] }
cosmic-text = "0.19.0"
swash = "0.2.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = { version = "0.38", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
dispatch2 = { version = "0.3.0", optional = true }
block2 = { version = "0.6.2", optional = true }

[build-dependencies]
serde_json = "1"
sha2 = "0.11.0"

[features]
default = ["dx12"]
dx12 = ["dep:serde_json", "dep:sha2", "dep:windows", "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common", "windows/Win32_System_Threading", "windows/Win32_Security"]
vulkan = ["dep:serde_json", "dep:sha2", "dep:ash"]
metal = ["dep:serde_json", "dep:sha2", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation", "dep:dispatch2", "dep:block2"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unnecessary_wraps = "warn"

# GPU/image formats deliberately quantize coordinates and colors. Allocation,
# addressing and public input validation still use checked conversions.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Exact comparisons identify unchanged state and tile-edge ownership. Fusing
# arithmetic changes SVG/reference rounding, even when it is mathematically equal.
float_cmp = "allow"
suboptimal_flops = "allow"
# Algebraic names, module-local preludes and explicit crate visibility keep the
# renderer's internal API readable; these naming preferences are audited only.
many_single_char_names = "allow"
similar_names = "allow"
wildcard_imports = "allow"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
# A complete encoding recipe or conformance table can exceed the generic line
# limit. File/module boundaries and algorithm structure are reviewed directly.
too_many_lines = "allow"
# Empty-collection assertions should not require element PartialEq/Debug impls.
assert_is_empty = "allow"
# Keep local helpers beside the algorithm step they explain. Explicit branches
# are clearer than closures when updating multiple renderer caches.
items_after_statements = "allow"
option_if_let_else = "allow"
# Explicit two-component coordinates work in const functions and keep GPU ABI
# component order visible without additional conversion type annotations.
tuple_array_conversions = "allow"

# restriction contains mutually exclusive language/style bans. Enable useful
# checks individually; CI also records an unfiltered scan of the entire group.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
default_union_representation = "deny"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
large_include_file = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "deny"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "deny"
unnecessary_rest_pattern = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[dev-dependencies]
tempfile = "3.23"
env_logger = { version = "0.11", default-features = false }
ash = "0.38"
serde_json = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
sha2 = "0.11.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2 = "0.6.4"
objc2-metal = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = "0.3.0"

[[example]]
name = "compare_png_pixels"
path = "examples/compare_png_pixels/main.rs"
test = true

[[example]]
name = "native_present"
test = true
path = "examples/native_window/main.rs"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[package]
name = "tileink"
version = "0.1.0"
edition = "2024"

[dependencies]
cubecl = { version = "0.10.0", default-features = false, features = ["std", "stdlib", "wgpu"] }
cubecl-common = { version = "0.10.0", optional = true }
peniko = "0.6.1"
bytemuck = "1.25.0"
wgpu = { version = "29.0.3", optional = true }
usvg = "0.47.0"
wide = "1.5.0"
rayon = "1.12.0"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "webp"] }
cosmic-text = "0.19.0"
fontdb = { version = "0.23", default-features = false }
swash = "0.2.6"
comfy-table = { version = "7.2.2", default-features = false, optional = true }
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
windows-numerics = { version = "0.3.1", optional = true }

[features]
bench-api = []
cuda = ["cubecl/cuda"]
directwrite-reference = ["dep:windows", "dep:windows-numerics"]
profile = ["dep:comfy-table", "dep:cubecl-common"]
wgpu = ["dep:wgpu"]

[dev-dependencies]
criterion = "0.5"
cubecl-common = "0.10.0"
pollster = "0.4"
vello = { path = "C:\\Users\\JianJian Li\\vello\\vello", default-features = true }
wgpu = "29.0.3"
winit = "0.30"

[[bench]]
name = "cubecl_dense_compare"
harness = false
required-features = ["bench-api"]

[[bench]]
name = "gpu_compare"
harness = false
required-features = ["bench-api"]

[[bench]]
name = "tiger_gpu_compare"
harness = false
required-features = ["bench-api"]


name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo and Clippy artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('build.rs', 'build/**/*.rs', 'src/wgpu/dxil_manifest.rs', 'src/wgpu/shader_variants.rs', 'src/wgpu/shaders/**/*.wgsl') }}
          restore-keys: |
            cargo-clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-clippy-${{ runner.os }}-
      - name: Select stable Rust
        run: rustup default stable
      - name: Install Clippy
        run: rustup component add clippy
      - name: Lint all targets
        run: cargo clippy --release --all-targets -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo test artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('build.rs', 'build/**/*.rs', 'src/wgpu/dxil_manifest.rs', 'src/wgpu/shader_variants.rs', 'src/wgpu/shaders/**/*.wgsl') }}
          restore-keys: |
            cargo-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-tests-${{ runner.os }}-
      - name: Select stable Rust
        run: rustup default stable
      - name: Run release tests serially
        run: cargo test --release -- --test-threads=1

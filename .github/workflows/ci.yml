name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  RAYON_NUM_THREADS: "1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      # No renderer consumes the internal execution paths in this profile.
      - run: cargo clippy --release --lib --no-default-features -- -A dead_code -A unused_imports -D clippy::unnecessary_wraps
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, feature: dx12 }
          - { os: windows-latest, feature: vulkan }
          - { os: macos-latest, feature: metal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dxc
        if: runner.os != 'macOS'
      - run: rustup component add clippy
      - run: cargo clippy --release --all-targets --no-default-features --features ${{ matrix.feature }} -- -D warnings
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, feature: vulkan }
          - { os: windows-latest, feature: dx12 }
          - { os: windows-latest, feature: vulkan }
          - { os: macos-latest, feature: metal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dxc
        if: runner.os != 'macOS'
      - run: cargo test --release --no-default-features --features ${{ matrix.feature }} -- --test-threads=1
      - run: cargo test --release --no-default-features --features ${{ matrix.feature }} --test native_shader_compiler -- --test-threads=1 --include-ignored
        if: runner.os != 'macOS'
      - run: cargo build --release --no-default-features --features ${{ matrix.feature }} --examples

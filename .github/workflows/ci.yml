name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy
      - run: cargo clippy --release --all-targets --no-default-features --features vulkan -- -D warnings
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, feature: vulkan }
          - { os: windows-latest, feature: dx12 }
          - { os: macos-latest, feature: metal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --release --no-default-features --features ${{ matrix.feature }} -- --test-threads=1
      - run: cargo build --release --no-default-features --features ${{ matrix.feature }} --examples
